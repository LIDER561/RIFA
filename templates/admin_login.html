{% extends "base.html" %}
{% block title %}Admin - Login{% endblock %}
{% block header_title %}Panel de administrador{% endblock %}

{% block content %}
<div class="card">
    <form method="POST">
        <div class="field">
            <label>Usuario</label>
            <input type="text" name="usuario" required>
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Ingresar</button>
    </form>
</div>
{% endblock %}
